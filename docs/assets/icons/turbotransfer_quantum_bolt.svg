<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1527"/>
      <stop offset="50%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>

    <!-- Cyan Beam Gradient -->
    <linearGradient id="cyanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Orange Beam Gradient -->
    <linearGradient id="orangeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Lightning Core Gradient -->
    <linearGradient id="boltGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#BAE6FD"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <!-- Inner Glow Gradients -->
    <linearGradient id="strokeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad1)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#strokeGrad1)" stroke-width="4"/>

  <!-- Left Wing (Cyan) -->
  <path d="M 130 148 C 130 134 142 124 156 124 L 230 124 C 238 124 246 130 248 138 L 254 168 C 256 178 248 188 238 188 L 198 188 L 198 236 C 198 246 190 254 180 254 L 148 254 C 138 254 130 246 130 236 Z" fill="url(#cyanGrad1)"/>

  <!-- Right Wing (Orange) -->
  <path d="M 282 124 L 356 124 C 370 124 382 134 382 148 L 382 236 C 382 246 374 254 364 254 L 332 254 C 322 254 314 246 314 236 L 314 188 L 274 188 C 264 188 256 178 258 168 L 264 138 C 266 130 274 124 282 124 Z" fill="url(#orangeGrad1)"/>

  <!-- High-Speed Dynamic Flow Waves (Multipath) -->
  <!-- Cyan Flow Arc -->
  <path d="M 112 300 C 112 370 180 420 270 412 C 340 406 394 360 420 310" fill="none" stroke="url(#cyanGrad1)" stroke-width="16" stroke-linecap="round" filter="url(#softGlow1)"/>
  <path d="M 404 290 L 434 310 L 400 334 Z" fill="#00E5FF"/>

  <!-- Orange Counter Flow Arc -->
  <path d="M 148 340 C 180 388 240 428 320 428 C 366 428 408 406 434 372" fill="none" stroke="url(#orangeGrad1)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow1)"/>
  <path d="M 424 354 L 448 370 L 424 388 Z" fill="#FB923C"/>

  <!-- Central Lightning Bolt Core (Supersonic Turbo Punch) -->
  <path d="M 286 78 C 288 70 278 64 272 70 L 186 218 C 182 226 188 236 198 236 L 254 236 L 208 424 C 204 436 220 442 226 432 L 334 250 C 338 242 332 232 322 232 L 266 232 L 298 84 Z" fill="url(#boltGrad1)" filter="url(#softGlow1)"/>

  <!-- Lightning Highlight Spark -->
  <polygon points="266,232 292,100 274,210" fill="#FFFFFF" opacity="0.6"/>
</svg>
