<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>

    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="rocketNose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="wifiBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad3)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Wi-Fi Pulse Arcs (Top-Right) -->
  <path d="M 330 110 C 370 120 400 150 410 190" fill="none" stroke="url(#wifiBeam)" stroke-width="12" stroke-linecap="round" filter="url(#glow3)"/>
  <path d="M 360 80 C 420 100 450 140 460 200" fill="none" stroke="url(#wifiBeam)" stroke-width="14" stroke-linecap="round" filter="url(#glow3)"/>
  <path d="M 390 50 C 460 80 500 130 510 210" fill="none" stroke="url(#wifiBeam)" stroke-width="16" stroke-linecap="round" opacity="0.4"/>

  <!-- Exhaust Turbo Fire & Shockwaves (Bottom-Left) -->
  <path d="M 190 320 L 100 410 C 90 420 70 410 80 390 L 130 340 Z" fill="url(#flameGrad)" filter="url(#glow3)"/>
  <path d="M 180 330 L 70 440 C 60 450 50 440 60 430 L 130 370 Z" fill="url(#flameGrad)" opacity="0.8"/>
  <path d="M 170 340 L 40 470 C 30 480 30 460 50 440 L 120 380 Z" fill="#FDE047" opacity="0.6"/>

  <!-- Left Fin -->
  <path d="M 180 300 L 130 320 C 120 324 120 338 130 342 L 180 330 Z" fill="#0284C7"/>
  <!-- Right Fin -->
  <path d="M 280 200 L 330 250 C 338 258 334 270 322 270 L 250 270 Z" fill="#0284C7"/>

  <!-- Rocket Fuselage (45 deg angle) -->
  <path d="M 190 330 C 230 310 290 250 330 190 C 360 140 370 110 370 110 C 370 110 340 120 290 150 C 230 190 170 250 150 290 Z" fill="url(#rocketBody)"/>
  
  <!-- Nose Cone -->
  <path d="M 330 150 C 350 130 370 110 370 110 C 370 110 350 130 330 150 Z" fill="url(#rocketNose)"/>

  <!-- Porthole / Window -->
  <circle cx="280" cy="200" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="5"/>
  <circle cx="280" cy="200" r="14" fill="#00E5FF"/>
  <circle cx="276" cy="196" r="4" fill="#FFFFFF"/>

  <!-- Speed Streamlines -->
  <line x1="210" y1="120" x2="260" y2="70" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="150" y1="180" x2="190" y2="140" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
