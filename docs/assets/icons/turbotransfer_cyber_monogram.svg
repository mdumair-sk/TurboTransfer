<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1E"/>
      <stop offset="50%" stop-color="#111B38"/>
      <stop offset="100%" stop-color="#050A15"/>
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="cyberOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <filter id="neonGlow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad4)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Left Speed Wings / Streaks -->
  <path d="M 330 140 L 430 140 L 400 160 L 330 160 Z" fill="url(#cyberCyan)" opacity="0.8"/>
  <path d="M 340 170 L 410 170 L 390 186 L 340 186 Z" fill="url(#cyberCyan)" opacity="0.6"/>
  <path d="M 350 196 L 390 196 L 375 208 L 350 208 Z" fill="url(#cyberCyan)" opacity="0.4"/>

  <!-- Outer Cyber T Frame -->
  <path d="M 120 130 C 120 120 130 110 144 110 L 370 110 C 382 110 390 120 384 132 L 350 200 C 346 208 336 214 326 214 L 286 214 L 230 400 C 226 412 210 416 200 406 L 150 356 C 144 350 144 340 148 332 L 198 214 L 140 214 C 128 214 120 204 120 192 Z" fill="none" stroke="url(#cyberCyan)" stroke-width="12" stroke-linejoin="round" filter="url(#neonGlow4)"/>

  <!-- Cyber T Core Shape -->
  <path d="M 136 130 L 360 130 L 332 186 L 268 186 L 208 386 L 170 348 L 220 186 L 136 186 Z" fill="url(#cyberCyan)"/>

  <!-- Inset Lightning Energy Split (Orange/Gold) -->
  <path d="M 276 130 L 226 230 L 262 230 L 210 386 L 246 250 L 210 250 L 254 130 Z" fill="url(#cyberOrange)" filter="url(#neonGlow4)"/>
</svg>
