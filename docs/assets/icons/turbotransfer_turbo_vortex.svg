<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="50%" stop-color="#101F42"/>
      <stop offset="100%" stop-color="#050B1A"/>
    </linearGradient>

    <!-- Top Vortex Cyan Gradient -->
    <linearGradient id="vortexTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Bottom Vortex Azure Gradient -->
    <linearGradient id="vortexBottom" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="lightningGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="vortexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad2)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Top-Right Vortex Arm & Arrow -->
  <path d="M 170 140 C 230 96 320 100 376 150 C 420 190 430 250 410 300 C 390 240 350 180 290 160 C 240 144 190 156 170 168 Z" fill="url(#vortexTop)"/>
  <path d="M 120 280 C 110 200 160 130 240 100" fill="none" stroke="url(#vortexTop)" stroke-width="26" stroke-linecap="round" filter="url(#vortexGlow)"/>
  <polygon points="266,74 274,126 230,102" fill="#00E5FF"/>

  <!-- Bottom-Left Vortex Arm & Arrow -->
  <path d="M 342 372 C 282 416 192 412 136 362 C 92 322 82 262 102 212 C 122 272 162 332 222 352 C 272 368 322 356 342 344 Z" fill="url(#vortexBottom)"/>
  <path d="M 392 232 C 402 312 352 382 272 412" fill="none" stroke="url(#vortexBottom)" stroke-width="26" stroke-linecap="round" filter="url(#vortexGlow)"/>
  <polygon points="246,438 238,386 282,410" fill="#0284C7"/>

  <!-- Center Energy Core Flare -->
  <circle cx="256" cy="256" r="64" fill="#0F172A" stroke="#00E5FF" stroke-width="3" opacity="0.6"/>

  <!-- Central Sharp Lightning Bolt -->
  <path d="M 288 152 L 208 260 C 204 266 208 274 216 274 L 258 274 L 224 360 C 220 370 234 376 238 366 L 314 248 C 318 242 314 234 306 234 L 264 234 L 294 158 C 298 150 292 144 288 152 Z" fill="url(#lightningGrad2)" filter="url(#vortexGlow)"/>
</svg>
