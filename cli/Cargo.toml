[package]
name = "turbotransfer-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "turbo"
path = "src/main.rs"

[dependencies]
turbotransfer-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
uuid = "1.10"
serde_json = "1.0"
