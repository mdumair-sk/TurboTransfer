[package]
name = "turbotransfer-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
turbotransfer-core = { path = "../core" }
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.17"

