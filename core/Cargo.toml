[package]
name = "turbotransfer-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "turbotransfer_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bincode = "1.3"
uuid = { version = "1.10", features = ["serde", "v4"] }
tokio = { version = "1.38", features = ["io-util", "sync", "rt", "rt-multi-thread", "macros", "time", "net"] }
async-trait = "0.1"

thiserror = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
crc32c = "0.6"
bytes = { version = "1.6", features = ["serde"] }
socket2 = "0.5"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

log = "0.4"
uniffi = { version = "0.28", features = ["tokio", "build"] }
uniffi_bindgen = "0.28"
camino = "1.1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dev-dependencies]
tempfile = "3.10"
